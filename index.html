<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mida · 正在连接天界…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6a5cff 0%, #38b6ff 100%);
    color: #fff;
  }
  .wrap { text-align: center; padding: 30px; }
  .ring {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border: 4px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 16px; font-weight: 600; }
  .link {
    display: inline-block; margin-top: 16px; padding: 9px 22px;
    border-radius: 999px; background: rgba(255,255,255,.18);
    color: #fff; text-decoration: none; font-size: 14px; font-weight: 600;
  }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <p class="status" id="status">正在连接天界…</p>
    <a class="link hidden" id="link" href="#">点这里手动进入</a>
  </div>
<script>
  // 从 url.json 读取当前隧道地址并跳转（加时间戳绕过 CDN 缓存）
  fetch('url.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      if (!cfg || !cfg.url) throw new Error('empty');
      var link = document.getElementById('link');
      link.href = cfg.url;
      link.classList.remove('hidden');
      link.textContent = '进入 mida';
      setTimeout(function () { location.replace(cfg.url); }, 600);
    })
    .catch(function () {
      document.getElementById('status').textContent = '暂时连不上，5 秒后自动重试…';
      setTimeout(function () { location.reload(); }, 5000);
    });
</script>
</body>
</html>
